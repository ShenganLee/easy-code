packages:
  - packages/*
  - apps/*
  - examples/*
  - "!**/fixtures/**"

catalogMode: prefer

catalog:
  "@arethetypeswrong/core": 0.18.5
  "@biomejs/biome": 2.6.3
  "@changesets/changelog-github": 1.0.1
  "@changesets/cli": 3.0.3
  "@size-limit/preset-small-lib": 14.3.0
  "@types/node": 24.19.2
  "@vitest/coverage-v8": 5.0.5
  cac: 7.1.0
  esbuild: 0.28.2
  execa: 10.2.1
  picocolors: 1.1.1
  publint: 0.3.25
  size-limit: 14.3.0
  tsdown: 0.23.2
  turbo: 2.11.10
  typescript: 7.0.2
  unconfig: 7.5.0
  valibot: 1.5.0
  vite: 8.3.5
  vitest: 5.0.5

# pnpm 11+ uses allowBuilds instead of onlyBuiltDependencies
allowBuilds:
  esbuild: true

engineStrict: true

# Supply chain: wait at least one day before installing a newly published version
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Refuse packages whose trust level has dropped
trustPolicy: no-downgrade

# Refuse transitive dependencies fetched through exotic protocols
blockExoticSubdeps: true

# Dependency build scripts must be explicitly allowed
strictDepBuilds: true
